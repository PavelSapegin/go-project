definitions:
  client.Response:
    properties:
      director:
        type: string
      id:
        type: integer
      title:
        type: string
      year:
        type: integer
    type: object
  handler.ErrorResponse:
    properties:
      message:
        type: string
    type: object
  handler.LoadMoviesResponse:
    properties:
      errors:
        additionalProperties:
          type: string
        type: object
      movies:
        items:
          $ref: '#/definitions/client.Response'
        type: array
    type: object
info:
  contact: {}
  description: This is a sample server for a movie API.
  termsOfService: http://swagger.io/terms/
  title: Movie API
  version: "1.0"
paths:
  /last-movie:
    get:
      description: Fetches the last movie from the external service.
      produces:
      - application/json
      responses:
        "200":
          description: Last movie details
          schema:
            $ref: '#/definitions/client.Response'
        "404":
          description: No movies found
          schema:
            type: string
        "502":
          description: External service error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "504":
          description: Request to external service timed out
          schema:
            type: string
      summary: Get the last movie
  /load-movies:
    get:
      description: Fetches movies from the external service based on the provided
        'from' and 'to' query parameters.
      parameters:
      - description: Starting movie ID
        in: query
        name: from
        required: true
        type: integer
      - description: Ending movie ID
        in: query
        name: to
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of fetched movies along with any partial errors
          schema:
            $ref: '#/definitions/handler.LoadMoviesResponse'
        "400":
          description: Missing or invalid 'from' or 'to' parameter
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
        "504":
          description: Request to external service timed out
          schema:
            type: string
      summary: Get movies from a specified range
swagger: "2.0"
